name: Deploy to DEV Oracle Cloud
on:
  push:
    branches:
      - main_dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Clean workspace
        run: |
          # Limpiar archivos que pueden causar problemas
          find . -name "*.log" -delete 2>/dev/null || true
          find . -name ".DS_Store" -delete 2>/dev/null || true
          rm -rf node_modules 2>/dev/null || true
          
      - name: Archive needed files
        run: |
          # Crear directorio temporal limpio
          mkdir -p /tmp/deploy_source
          
          # Copiar solo los archivos necesarios
          rsync -av --progress . /tmp/deploy_source/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='*.tmp' \
            --exclude='*.cache'
          
          # Crear tar desde el directorio limpio y guardarlo en el workspace
          cd /tmp/deploy_source
          tar -czf $GITHUB_WORKSPACE/app.tar.gz .
              
      - name: Upload archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "app.tar.gz"
          target: "/home/ubuntu/proyectoSoftwere/dev"
          
      - name: SSH deploy & extract
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/proyectoSoftwere/dev
            rm -rf backend
            mkdir -p backend
            tar -xzf app.tar.gz -C backend
            rm app.tar.gz
            docker compose build
            docker compose up -d
