name: Deploy to DEV Oracle Cloud
on:
  push:
    branches:
      - main_dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Clean workspace
        run: |
          # Limpiar archivos que pueden causar problemas
          find . -name "*.log" -delete 2>/dev/null || true
          find . -name ".DS_Store" -delete 2>/dev/null || true
          rm -rf node_modules 2>/dev/null || true
          
      - name: Archive needed files
        run: |
          # Método más simple usando tar directamente con ignore de warnings
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='*.log' \
              --exclude='.DS_Store' \
              --exclude='*.tmp' \
              --exclude='*.cache' \
              --ignore-failed-read \
              -czf app.tar.gz . || true
          
          # Verificar que el archivo se creó correctamente
          if [ ! -f "app.tar.gz" ]; then
            echo "Error: app.tar.gz no se creó"
            exit 1
          fi
          
          ls -la app.tar.gz
              
      - name: Upload archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "app.tar.gz"
          target: "/home/ubuntu/proyectoSoftwere/dev"
          
      - name: SSH deploy & extract
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/proyectoSoftwere/dev
            
            # Respaldar archivos específicos importantes
            if [ -f "backend/.env" ]; then
              cp backend/.env .env.backup
              echo "Respaldando .env existente"
            fi
            
            if [ -f "backend/.env.production" ]; then
              cp backend/.env.production .env.production.backup
              echo "Respaldando .env.production existente"
            fi
            
            # Parar contenedores
            docker compose down 2>/dev/null || true
            
            # Borrar y recrear
            rm -rf backend
            mkdir -p backend
            tar -xzf app.tar.gz -C backend
            rm app.tar.gz
            
            # Restaurar archivos específicos
            if [ -f ".env.backup" ]; then
              cp .env.backup backend/.env
              rm .env.backup
              echo ".env restaurado"
            fi
            
            if [ -f ".env.production.backup" ]; then
              cp .env.production.backup backend/.env.production
              rm .env.production.backup
              echo ".env.production restaurado"
            fi
            docker compose down -v
            docker compose build
            docker compose up -d
